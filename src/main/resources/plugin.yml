
name: RF-CSGO
version: 1.0.1
main: id.rf.csgo.RFCsgo
api-version: '1.21'
author: RF
description: CS:GO Style Team PvP Plugin

commands:
  random:
    description: Membagi pemain secara acak ke tim Merah dan Biru
    usage: /random

  byone:
    description: Memulai duel 1 lawan 1
    usage: /byone <player1> <player2>

  setspawn:
    description: Mengatur spawn tim
    usage: /setspawn <merah|biru|duel>

  startmatch:
    description: Memulai pertandingan
    usage: /startmatch

  stopmatch:
    description: Menghentikan pertandingan
    usage: /stopmatch

  resetmatch:
    description: Mereset skor pertandingan
    usage: /resetmatch

  score:
    description: Menampilkan skor Merah, Biru, dan ronde di chat
    usage: /score
    
