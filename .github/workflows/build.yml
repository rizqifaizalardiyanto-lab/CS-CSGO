
name: Build RF-CSGO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check project files
        run: |
          test -f pom.xml
          test -f src/main/resources/plugin.yml
          test -f src/main/java/id/rf/csgo/RFCsgo.java

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RF-CSGO-JAR
          path: target/*.jar
          if-no-files-found: error
          
