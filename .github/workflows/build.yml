name: Build RF-CSGO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RF-CSGO-JAR
          path: target/RF-CSGO-1.0.0.jar
          
